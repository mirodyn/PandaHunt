# fly.toml app configuration file generated for pandahunt on 2026-11-15T07:30:41Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'pandahunt'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  ASPNETCORE_FORWARDEDHEADERS_ENABLED = 'true'
  ConnectionStrings__Default = 'Data Source=/data/pandahunt.db'
  DataProtection__KeysPath = '/data/keys'

[[mounts]]
  source = 'pandahunt_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

# Start the app again whenever it stops, also after a clean exit - the hard reset on /admin (tab "Reset")
# shuts the app down on purpose and relies on this. Fly's default ("on-failure") only restarts after a crash.
[[restart]]
  policy = 'always'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
